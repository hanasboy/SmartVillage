name: Build SmartVillage DLL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore SmartVillage.csproj

    - name: Build DLL
      run: dotnet build SmartVillage.csproj -c Release

    - name: Upload DLL artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartVillage-DLL
        path: bin/Release/net8.0/SmartVillage.dll
